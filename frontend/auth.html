<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 / 註冊 | SportBoard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="auth">
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-brand">
        <span class="brand-logo">SB</span>
        <div class="brand-copy">
          <span class="brand-title">SportBoard</span>
        </div>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" type="button" data-auth-panel="login">登入</button>
        <button class="auth-tab" type="button" data-auth-panel="register">註冊</button>
      </div>

      <section id="auth-login" class="auth-panel active">
        <form id="login-form" class="auth-form">
          <input type="text" name="username" placeholder="帳號" required>
          <input type="password" name="password" placeholder="密碼" required>
          <button type="submit" class="primary-btn">登入</button>
        </form>
        <div id="login-status" class="auth-note status-line"></div>
      </section>

      <section id="auth-register" class="auth-panel">
        <form id="register-form" class="auth-form">
          <input type="text" name="username" placeholder="帳號" required>
          <input type="email" name="email" placeholder="Email" required>
          <input type="password" name="password" placeholder="密碼" required>
          <button type="submit" class="primary-btn">註冊</button>
        </form>
        <div id="register-status" class="auth-note status-line"></div>
        <div id="register-next" class="auth-note status-line"></div>
      </section>
    </section>
  </main>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
