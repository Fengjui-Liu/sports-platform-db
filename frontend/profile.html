<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的頁面 | SportBoard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="profile">
  <div class="site-shell">
    <header id="site-header" class="site-header"></header>

    <main class="main-content">
      <div class="page-stack profile-container">
        <div class="profile-home-action">
          <a class="ghost-btn" href="/" style="display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:16px;font-weight:800;text-decoration:none;">
            ← 返回首頁
          </a>
        </div>

        <section id="profile-card" class="page-hero"></section>

        <div class="profile-main-layout">
          <div class="profile-left-column">
            <section class="panel-card">
              <div class="section-head">
                <h2>更新資料</h2>
              </div>
              <form id="profile-form" class="inline-form">
                <textarea name="bio" placeholder="自我介紹"></textarea>
                <label class="form-field avatar-upload-field">
                  <span>選擇頭像檔案</span>
                  <img id="avatar-preview" class="avatar-preview" alt="頭像預覽" hidden>
                  <input id="avatar-file" type="file" name="avatar" accept="image/jpeg,image/png,image/webp">
                  <small class="meta-line">支援 JPG、PNG、WEBP，檔案大小上限 5MB。</small>
                </label>
                <div class="avatar-upload-actions">
                  <button type="button" id="remove-avatar-btn" class="secondary-btn" hidden>移除頭像</button>
                </div>
                <div id="profile-form-status" class="form-status" aria-live="polite"></div>
                <button type="submit" class="primary-btn">更新資料</button>
              </form>
            </section>

            <section class="panel-card profile-posts-card">
              <div class="section-head">
                <div>
                  <h2>我的貼文</h2>
                  <p class="section-copy">你發布過的貼文</p>
                </div>
              </div>
              <div id="profile-posts" class="stack-list my-posts-list"></div>
            </section>
          </div>

          <section class="panel-card body-data-card">
            <div class="section-head">
              <h2>身體數據</h2>
            </div>
            <div id="bodyrecord-chart"></div>
            <form id="bodyrecord-form" class="inline-form">
              <input type="number" name="weight" placeholder="體重 kg" step="0.1" required>
              <input type="number" name="height" placeholder="身高 cm" step="0.1" required>
              <input type="number" name="body_fat" placeholder="體脂 %" step="0.1" required>
              <input type="datetime-local" name="recorded_at" required>
              <div id="bodyrecord-status" class="form-status" aria-live="polite"></div>
              <button type="submit" class="secondary-btn">新增數據</button>
            </form>
          </section>
        </div>

        <section class="panel-card profile-section-full">
          <div class="section-head">
            <h2>我的訓練計畫</h2>
          </div>
          <div id="profile-created-plans" class="stack-list"></div>
        </section>

        <section class="panel-card profile-section-full">
          <div class="section-head">
            <h2>我建立的揪團</h2>
          </div>
          <div id="profile-created-invitations" class="stack-list"></div>
        </section>

        <section class="panel-card profile-section-full">
          <div class="section-head">
            <h2>我參加的揪團</h2>
          </div>
          <div id="profile-joined-invitations" class="stack-list"></div>
        </section>

        <section class="panel-card profile-section-full">
          <div class="section-head">
            <h2>訓練紀錄</h2>
          </div>
          <form id="session-form" class="inline-form">
            <input type="hidden" name="user_id">
            <label class="form-field">
              <span>連結訓練計畫（選填）</span>
              <select id="session-plan-select" name="plan_id">
                <option value="">不連結訓練計畫</option>
              </select>
            </label>
            <textarea name="notes" placeholder="訓練備註（選填）" rows="2"></textarea>
            <label class="form-field">
              <span>開始時間</span>
              <input type="datetime-local" name="start_time" required>
            </label>
            <label class="form-field">
              <span>結束時間</span>
              <input type="datetime-local" name="end_time" required>
            </label>
            <div id="session-status" class="form-status" aria-live="polite"></div>
            <button type="submit" class="secondary-btn">新增訓練紀錄</button>
          </form>
          <div id="profile-sessions" class="stack-list"></div>
        </section>

        <section class="panel-card profile-section-full">
          <div class="section-head">
            <h2>收藏計畫</h2>
          </div>
          <div id="profile-saved-plans" class="stack-list"></div>
        </section>
      </div>
    </main>

    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
