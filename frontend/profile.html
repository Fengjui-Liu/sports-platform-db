<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的頁面 | SportBoard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="profile">
  <div class="site-shell">
    <header id="site-header" class="site-header"></header>

    <main class="main-content">
      <div class="page-stack">
        <div class="profile-home-action">
          <a
            class="ghost-btn"
            href="/"
            style="
              display:inline-flex;
              align-items:center;
              justify-content:center;
              padding:12px 18px;
              border-radius:16px;
              font-weight:800;
              text-decoration:none;
            "
          >
            ← 返回首頁
          </a>
        </div>

        <section id="profile-card" class="page-hero"></section>

        <div class="grid-2">
          <section class="panel-card">
            <div class="section-head">
              <div>
                <h2>更新資料</h2>
                <p class="section-copy">修改自我介紹與頭像</p>
              </div>
              <span class="helper-text">Edit</span>
            </div>

            <form id="profile-form" class="inline-form">
              <textarea name="bio" placeholder="自我介紹"></textarea>
              <input type="url" name="profile_image" placeholder="頭像網址">
              <button type="submit" class="primary-btn">更新資料</button>
            </form>
          </section>

          <section class="panel-card">
            <div class="section-head">
              <div>
                <h2>身體數據</h2>
                <p class="section-copy">紀錄體重、身高與體脂變化</p>
              </div>
              <span class="helper-text">Body</span>
            </div>

            <div id="bodyrecord-chart"></div>

            <form id="bodyrecord-form" class="inline-form">
              <input type="number" name="weight" placeholder="體重 kg" step="0.1" required>
              <input type="number" name="height" placeholder="身高 cm" step="0.1" required>
              <input type="number" name="body_fat" placeholder="體脂 %" step="0.1" required>
              <input type="datetime-local" name="recorded_at">
              <button type="submit" class="secondary-btn">新增數據</button>
            </form>
          </section>
        </div>

        <section class="panel-card">
          <div class="section-head">
            <div>
              <h2>我的貼文</h2>
              <p class="section-copy">你發佈過的貼文</p>
            </div>
            <span class="helper-text">Posts</span>
          </div>

          <div id="profile-posts" class="stack-list"></div>
        </section>

        <section class="panel-card">
          <div class="section-head">
            <div>
              <h2>我建立的訓練計畫</h2>
              <p class="section-copy">你建立的訓練菜單</p>
            </div>
            <span class="helper-text">My Plans</span>
          </div>

          <div id="profile-created-plans" class="stack-list"></div>
        </section>

        <section class="panel-card">
          <div class="section-head">
            <div>
              <h2>我建立的揪團</h2>
              <p class="section-copy">你發起的活動</p>
            </div>
            <span class="helper-text">My Groups</span>
          </div>

          <div id="profile-created-invitations" class="stack-list"></div>
        </section>

        <section class="panel-card">
          <div class="section-head">
            <div>
              <h2>我參加的揪團</h2>
              <p class="section-copy">你加入的活動</p>
            </div>
            <span class="helper-text">Joined Groups</span>
          </div>

          <div id="profile-joined-invitations" class="stack-list"></div>
        </section>

        <section class="panel-card">
          <div class="section-head">
            <div>
              <h2>訓練紀錄</h2>
              <p class="section-copy">近期完成的訓練</p>
            </div>
            <span class="helper-text">Sessions</span>
          </div>

          <div id="profile-sessions" class="stack-list"></div>
        </section>

        <section class="panel-card">
          <div class="section-head">
            <div>
              <h2>收藏計畫</h2>
              <p class="section-copy">你收藏的訓練菜單</p>
            </div>
            <span class="helper-text">Saved Plans</span>
          </div>

          <div id="profile-saved-plans" class="stack-list"></div>
        </section>
      </div>
    </main>

    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
