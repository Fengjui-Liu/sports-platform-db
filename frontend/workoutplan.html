<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>訓練計畫 | SportBoard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="plans">
  <div class="site-shell">
    <header id="site-header" class="site-header"></header>
    <div class="site-body">
      <aside id="board-sidebar" class="sidebar"></aside>
      <main class="main-content">
        <div class="page-stack">
          <section id="mobile-board-bar" class="mobile-board-bar"></section>
          <div class="detail-layout">
            <section id="plan-detail" class="panel-card"></section>

            <section class="panel-card">
              <div class="section-head">
                <h2>開始訓練</h2>
              </div>
              <form id="session-form" class="inline-form">
                <input type="hidden" name="user_id">
                <textarea name="notes" placeholder="訓練備註"></textarea>
                <input type="datetime-local" name="start_time" required>
                <input type="datetime-local" name="end_time" required>
                <button type="submit" class="primary-btn">送出訓練紀錄</button>
              </form>
              <div id="plan-status" class="status-line"></div>
            </section>
          </div>
        </div>
      </main>
    </div>
    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/workoutplan.js"></script>
</body>
</html>
