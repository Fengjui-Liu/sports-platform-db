<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>運動專欄 | SportBoard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="boards">
  <div class="site-shell">
    <header id="site-header" class="site-header"></header>

    <div class="site-body">
      <aside id="board-sidebar" class="sidebar"></aside>

      <main class="main-content">
        <div class="page-stack">
          <section id="mobile-board-bar" class="mobile-board-bar"></section>

          <section id="board-hero" class="page-hero"></section>

          <section class="panel-card">
            <div class="tab-row">
              <button class="tab-btn active" data-tab="posts" type="button">貼文</button>
              <button class="tab-btn" data-tab="plans" type="button">訓練計畫</button>
              <button class="tab-btn" data-tab="invitations" type="button">揪團</button>
            </div>
          </section>

          <section id="tab-posts" class="tab-panel active">
            <article class="panel-card">
              <div class="section-head">
                <h3>最新貼文</h3>
                <a
                  class="primary-btn"
                  href="/create.html?tab=posts"
                  style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:48px;line-height:1;"
                >
                  新增貼文
                </a>
              </div>
              <div id="board-posts" class="stack-list post-feed-list"></div>
            </article>
          </section>

          <section id="tab-plans" class="tab-panel">
            <article class="panel-card">
              <div class="section-head">
                <h3>訓練計畫</h3>
                <a class="ghost-btn" href="/create.html?tab=plans" style="text-decoration:none;">
                  新增計畫
                </a>
              </div>
              <div id="board-plans" class="card-grid"></div>
            </article>
          </section>

          <section id="tab-invitations" class="tab-panel">
            <article class="panel-card">
              <div class="section-head">
                <h3>揪團列表</h3>
                <a class="ghost-btn" href="/create.html?tab=invitations" style="text-decoration:none;">
                  建立揪團
                </a>
              </div>
              <div id="board-invitations" class="stack-list"></div>
            </article>
          </section>
        </div>
      </main>
    </div>

    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/board.js"></script>
</body>
</html>
