<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首頁 | SportBoard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="home">
  <div class="site-shell">
    <header id="site-header" class="site-header"></header>

    <div class="site-body">
      <aside id="board-sidebar" class="sidebar"></aside>

      <main class="main-content">
        <div class="page-stack">
          <section class="panel-card">
            <div class="section-head">
              <div>
                <h2>貼文動態</h2>
              </div>

              <div class="create-dropdown-container">
                <button id="btn-create-menu" class="primary-btn" style="min-height:48px;">+ 新增內容</button>
                <div id="create-dropdown-menu" class="create-dropdown-menu">
                  <a href="/create.html?tab=posts">新增貼文</a>
                  <a href="/create.html?tab=plans">新增計畫</a>
                  <a href="/create.html?tab=invitations">新增揪團</a>
                </div>
              </div>
            </div>

            <div id="feed-tabs" class="feed-tabs" style="display:none;">
              <button class="feed-tab-btn active" data-feed-tab="all">全部</button>
              <button class="feed-tab-btn" data-feed-tab="following">追蹤中</button>
            </div>

            <div id="latest-posts" class="stack-list post-feed-list"></div>
          </section>
        </div>
      </main>
    </div>

    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
