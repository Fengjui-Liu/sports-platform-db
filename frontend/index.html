<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首頁 | SportBoard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="home">
  <div class="site-shell">
    <header id="site-header" class="site-header"></header>

    <div class="site-body">
      <aside id="board-sidebar" class="sidebar"></aside>

      <main class="main-content">
        <div class="page-stack">
          <section id="welcome-banner" class="page-hero"></section>

          <section class="page-hero">
            <div>
              <p class="eyebrow">SportBoard</p>
              <h1>找到你的運動夥伴</h1>
              <p class="page-description">
                瀏覽運動專欄、查看最新貼文，或進入個人頁面管理你的訓練紀錄。
              </p>
            </div>

            <div
              class="chip-row"
              style="
                margin-left:auto;
                justify-content:flex-end;
                gap:12px;
                flex-wrap:wrap;
              "
            >
              <a 
                id="hero-board-link" 
                class="primary-btn" 
                href="/board.html" 
                style="
                  text-decoration:none;
                  display:inline-flex;
                  align-items:center;
                  justify-content:center;
                  text-align:center;
                  min-height:48px;
                  line-height:1;
                "
              >
                前往專欄
              </a>

              <a 
                id="hero-profile-link" 
                class="ghost-btn" 
                href="/auth.html?mode=login" 
                style="
                  text-decoration:none;
                  display:inline-flex;
                  align-items:center;
                  justify-content:center;
                  text-align:center;
                  min-height:48px;
                  line-height:1;
                "
              >
                登入 / 註冊
              </a>
            </div>
          </section>

          <section class="panel-card">
            <div class="section-head">
              <div>
                <h2>最新貼文</h2>
                <p class="section-copy">看看大家最近分享了什麼</p>
              </div>

              <div class="create-dropdown-container">
                <button id="btn-create-menu" class="primary-btn" style="min-height:48px;">+ 新增內容</button>
                <div id="create-dropdown-menu" class="create-dropdown-menu">
                  <a href="/create.html?tab=posts">新增貼文</a>
                  <a href="/create.html?tab=plans">新增計畫</a>
                  <a href="/create.html?tab=invitations">新增揪團</a>
                </div>
              </div>
            </div>

            <div id="latest-posts" class="stack-list post-feed-list"></div>
          </section>
        </div>
      </main>
    </div>

    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
