<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>貼文詳情 | SportBoard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="post">
  <div class="site-shell">
    <header id="site-header" class="site-header"></header>
    <div class="site-body">
      <aside id="board-sidebar" class="sidebar"></aside>
      <main class="main-content">
        <div class="page-stack narrow">
          <section id="mobile-board-bar" class="mobile-board-bar"></section>
          <section id="post-detail" class="panel-card"></section>

          <section class="panel-card">
            <div class="section-head">
              <h2>留言區 <span id="comment-count" style="font-size:15px;color:var(--muted);font-weight:400;"></span></h2>
            </div>
            <form id="comment-form" class="inline-form">
              <input type="hidden" name="user_id">
              <textarea name="content" placeholder="輸入你的留言" required></textarea>
              <button type="submit" class="primary-btn">送出留言</button>
            </form>
            <div id="comment-status" class="status-line"></div>
            <div id="comment-list" class="stack-list"></div>
          </section>
        </div>
      </main>
    </div>
    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>
  <script src="/js/app.js"></script>
  <script src="/js/post.js"></script>
</body>
</html>
