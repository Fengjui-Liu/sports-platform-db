<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>編輯貼文 | SportBoard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="compose">
  <div class="site-shell">
    <header id="site-header" class="site-header"></header>

    <main class="main-content">
      <div class="page-stack narrow">
        <div>
          <a id="back-to-post" class="ghost-btn" href="/" style="display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:16px;font-weight:800;text-decoration:none;">
            返回貼文
          </a>
        </div>

        <section class="panel-card">
          <div class="section-head">
            <h2>編輯貼文</h2>
          </div>

          <form id="edit-post-form" class="inline-form">
            <select id="edit-post-board" name="board_id" required>
              <option value="" disabled selected hidden>請選擇專欄</option>
            </select>

            <input type="text" name="title" placeholder="貼文標題" required>
            <textarea name="content" placeholder="貼文內容" required></textarea>
            <input type="url" name="image_url" placeholder="圖片網址，可留空">

            <div id="edit-post-status" class="status-line"></div>

            <div class="chip-row">
              <button type="submit" class="primary-btn">儲存修改</button>
              <a id="cancel-edit-post" class="ghost-btn" href="/" style="text-decoration:none;">取消</a>
            </div>
          </form>
        </section>
      </div>
    </main>

    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/edit-post.js"></script>
</body>
</html>
